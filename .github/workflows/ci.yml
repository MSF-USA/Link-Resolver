# Lint, build and test on every push and pull request.
#
# - lint: rustfmt and clippy (warnings are errors), for the GUI build and the CLI-only build.
# - build-and-test: the full Rust suite and the Bash/PowerShell script tests on Linux and
#   Windows, then a release build whose binaries are kept for a week as a smoke-test artifact.
#   Windows is the only place the PowerShell script test runs, so it is a real check here.
# - msrv: the crate still compiles on the minimum Rust version declared in Cargo.toml.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Libraries eframe's Linux backends and rfd link against or load.
  LINUX_PACKAGES: libxkbcommon-dev libwayland-dev libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

jobs:
  lint:
    name: Format and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux build libraries
        run: sudo apt-get update && sudo apt-get install -y $LINUX_PACKAGES
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo clippy --locked --no-default-features --bin link-resolver-cli --all-targets -- -D warnings

  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Install Linux build libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_PACKAGES
      - name: Rust tests (GUI and CLI)
        run: cargo test --locked
      - name: Rust tests (CLI only, no GUI dependencies)
        run: cargo test --locked --no-default-features
      - name: Script tests (Bash on Linux, PowerShell on Windows)
        run: python -m unittest discover -s tests -v
      - name: Release build
        run: cargo build --release --locked
      - name: Keep the binaries for a week
        uses: actions/upload-artifact@v7
        with:
          name: link-resolver-${{ runner.os }}
          path: |
            target/release/link-resolver
            target/release/link-resolver-cli
            target/release/link-resolver.exe
            target/release/link-resolver-cli.exe
          if-no-files-found: error
          retention-days: 7

  msrv:
    name: Minimum supported Rust (1.95)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux build libraries
        run: sudo apt-get update && sudo apt-get install -y $LINUX_PACKAGES
      - run: cargo build --locked --all-targets
