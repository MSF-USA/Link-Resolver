# Lint, build and test on every push and pull request.
#
# - lint: rustfmt and clippy (warnings are errors), for the GUI build and the CLI-only build.
# - build-and-test: the full Rust suite and the Bash/PowerShell script tests on Linux and
#   Windows and macOS, then a release build kept for a week as a smoke-test artifact.
#   Windows is the only place the PowerShell script test runs, so it is a real check here.
# - msrv: the crate still compiles on the minimum Rust version declared in Cargo.toml.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Libraries eframe's Linux backends and rfd link against or load.
  LINUX_PACKAGES: libxkbcommon-dev libwayland-dev libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

jobs:
  lint:
    name: Format and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux build libraries
        run: sudo apt-get update && sudo apt-get install -y $LINUX_PACKAGES
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo clippy --locked --no-default-features --bin link-resolver-cli --all-targets -- -D warnings

  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15, macos-15-intel]
        include:
          - os: macos-15
            macos_target: aarch64-apple-darwin
          - os: macos-15-intel
            macos_target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Install Linux build libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_PACKAGES
      - name: Rust tests (GUI and CLI)
        run: cargo test --locked
      - name: Rust tests (CLI only, no GUI dependencies)
        run: cargo test --locked --no-default-features
      - name: Script and packaging tests
        run: python -m unittest discover -s tests -v
      - name: Release build
        if: runner.os != 'macOS'
        run: cargo build --release --locked
      - name: Package macOS app and CLI (native, ad-hoc signed)
        if: runner.os == 'macOS'
        run: python3 packaging/package-macos.py --target "${{ matrix.macos_target }}"
      - name: Keep the binaries for a week
        uses: actions/upload-artifact@v7
        with:
          name: link-resolver-${{ runner.os }}-${{ runner.arch }}
          path: |
            target/release/link-resolver
            target/release/link-resolver-cli
            target/release/link-resolver.exe
            target/release/link-resolver-cli.exe
            dist/link-resolver*macos-*.zip
            dist/SHA256SUMS-macos-*
          if-no-files-found: error
          retention-days: 7

  msrv:
    name: Minimum supported Rust (1.95)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The Rust version goes in the input, not the action ref: the action's tags are Rust
      # version numbers, and Dependabot would "upgrade" a 1.95.0 ref to the newest tag,
      # which defeats a minimum-version check (and may not even be a released toolchain).
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux build libraries
        run: sudo apt-get update && sudo apt-get install -y $LINUX_PACKAGES
      - run: cargo build --locked --all-targets
