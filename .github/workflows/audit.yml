# Check Cargo.lock against the RustSec advisory database: weekly, whenever the lockfile
# changes, and on demand. Dependabot alerts cover the same ground from GitHub's side; this
# job also catches advisories for crates Dependabot has no update for yet.
name: Security audit

on:
  schedule:
    - cron: "0 6 * * 1"
  push:
    paths: ["Cargo.lock", ".cargo/audit.toml", ".github/workflows/audit.yml"]
  pull_request:
    paths: ["Cargo.lock", ".cargo/audit.toml"]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  checks: write

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned to the main-branch commit that moves the action to Node 24 (rustsec/audit-check#48);
      # v2.0.0 still declares Node 20. Switch back to a tag once a release includes it
      # (requested in rustsec/audit-check#53). Ignored advisories live in .cargo/audit.toml.
      - uses: rustsec/audit-check@858dc40f52ca2b8570b7a997c1c4e35c6fc9a432
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
