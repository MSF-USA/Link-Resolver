[package]
name = "link-resolver"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A minimal desktop URL redirect resolver with an optional CLI"
publish = false
default-run = "link-resolver"

[[bin]]
name = "link-resolver"
path = "src/main.rs"
required-features = ["gui"]

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:rfd"]

[profile.release]
lto = "thin"
strip = true

[dependencies]
eframe = { version = "0.37.0", optional = true, default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "clipboard", "accesskit", "persistence"] }
rfd = { version = "0.17.2", optional = true }
csv = "1.4.0"
# Feature unification selects ring for Rust TLS; no OpenSSL installation needed.
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
